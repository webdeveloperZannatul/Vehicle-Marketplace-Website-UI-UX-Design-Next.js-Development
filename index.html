<style>
:root{--navy:#101b2b;--navy2:#17263a;--ink:#17212e;--muted:#6e7986;--blue:#315efb;--blue2:#244be0;--line:#e4e8ed;--paper:#f8f9f8;--white:#fff;--green:#178566;--radius:16px;--shadow:0 12px 35px rgba(22,34,51,.07);--max:1320px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#fff;color:var(--ink);font-family:"DM Sans",sans-serif;font-size:14px;line-height:1.5}body.locked{overflow:hidden}button,input,select,textarea{font:inherit}button,a,select{touch-action:manipulation}button{cursor:pointer}a{color:inherit;text-decoration:none}img{display:block;max-width:100%;object-fit:cover}svg{width:19px;height:19px;stroke-width:1.8;flex-shrink:0}h1,h2,h3,h4,p{margin:0}h1,h2,h3,h4{font-family:Manrope,sans-serif;letter-spacing:-.04em;line-height:1.16}h1{font-size:clamp(42px,5.1vw,72px)}h2{font-size:clamp(30px,3.1vw,43px)}h3{font-size:20px}p{color:var(--muted)}.wrap{width:min(var(--max),calc(100% - 80px));margin:auto}.section{padding:100px 0}.section-soft{background:var(--paper)}.eyebrow{display:flex;align-items:center;gap:9px;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--blue)}.eyebrow:before{content:"";width:20px;height:2px;background:currentColor}.section-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:36px}.section-head h2{margin-top:12px}.section-head p{margin-top:10px}.text-link{display:inline-flex;align-items:center;gap:9px;font-weight:700;white-space:nowrap}.text-link svg{width:16px}.text-link:hover{color:var(--blue)}.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:48px;padding:0 22px;border:1px solid transparent;border-radius:7px;background:var(--blue);color:#fff;font-weight:700;transition:.2s}.btn:hover{background:var(--blue2);transform:translateY(-1px)}.btn svg{width:17px}.btn-light{background:#fff;color:var(--ink)}.btn-light:hover{background:#f0f3f7}.btn-outline{background:transparent;border-color:#d4dce4;color:var(--ink)}.btn-outline:hover{background:#f2f5f8}.btn-dark{background:var(--navy);color:#fff}.btn-dark:hover{background:#263a54}.btn-sm{min-height:40px;padding:0 15px}.icon-btn{display:inline-flex;align-items:center;justify-content:center;wi /* Header */
.site-header{position:absolute;z-index:20;top:0;left:0;right:0;color:#fff;border-bottom:1px solid rgba(255,255,255,.18)}.site-header.inner{position:relative;background:var(--navy)}.header-row{height:78px;display:flex;align-items:center;gap:42px}.logo{display:inline-flex;align-items:center;gap:10px;flex-shrink:0;color:inherit}.logo-mark{width:34px;height:34px;display:grid;place-items:center;border:1.5px solid currentColor;transform:skew(-13deg);border-radius:7px}.logo-mark span{font:800 22px Manrope;transform:skew(13deg);line-height:1}.logo-word{font:800 21px Manrope;letter-spacing:.13em}.nav{display:flex;align-items:center;gap:29px;flex:1}.nav a{font-size:13px;font-weight:600;opacity:.8;transition:.2s}.nav a:hover,.nav a.current{opacity:1}.header-actions{display:flex;align-items:center;gap:18px}.header-actions .icon-plain{position:relative;background:none;border:0;color:#fff;padding:5px}.fav-count{position:absolute;top:-3px;right:-4px;background:var(--blue);font-size:9px;border-radius:50%;width:15px;height:15px;display:grid;place-items:center}.header-login{font-weight:700;font-size:13px}.header-signup{min-height:39px;padding:0 17px;font-size:12px}.menu-btn{display:none;background:none;border:0;color:#fff;padding:5px}.mobile-nav{display:none}
/* Hero */
.hero{min-height:690px;height: min(790px, 92vh);position:relative;color:#fff;display:flex;align-items:center;background:#1b2832 url('https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=2400&q=85') center 56%/cover}.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,18,29,.89) 0%,rgba(8,18,29,.68) 39%,rgba(8,18,29,.15) 78%),linear-gradient(0deg,rgba(8,18,29,.35),transparent 35%)}.hero-content{position:relative;width:90%;padding-top:75px}.hero-kicker{display:flex;align-items:center;gap:10px;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#d5e0ed}.hero-kicker:before{content:"";height:2px;width:29px;background:#7995ff}.hero h1{max-width:690px;margin:22px 0 19px;color:#fff}.hero h1 em{font-style:normal;color:#a9beff}.hero-copy{color:#e0e6ec;font-size:16px;max-width:440px;line-height:1.7}.search-box{margin-top:38px;background:#fff;color:var(--ink);border-radius:10px;padding:8px;display:flex;align-items:stretch;max-width:830px;box-shadow:0 20px 50px rgba(0,0,0,.18)}.search-field{flex:1;min-width:0;padding:8px 19px;border-right:1px solid var(--line)}.search-field label{display:block;color:#88929d;text-transform:uppercase;font-size:9px;font-weight:800;letter-spacing:.1em}.search-field select{width:100%;border:0;background:transparent;color:var(--ink);font-size:13px;font-weight:700;outline:0;padding-top:5px}.search-box .btn{min-width:145px}.hero-foot{display:flex;gap:25px;align-items:center;margin-top:26px;font-size:12px;color:#e6ebf1}.hero-foot span{display:flex;align-items:center;gap:7px}.hero-foot svg{width:15px;height:15px;color:#a9beff}.hero-index{position:absolute;right:5%;bottom:45px;display:flex;align-items:center;gap:12px;font-size:11px;letter-spacing:.13em;color:#fff}.hero-index:before{content:"";height:1px;width:65px;background:rgba(255,255,255,.7)}
/* Categories */
.category-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.category-card{position:relative;overflow:hidden;border-radius:10px;height:240px;background:#273543;color:white}.category-card img{width:100%;height:100%;transition:transform .6s}.category-card:hover img{transform:scale(1.06)}.category-card:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(8,17,26,.85),rgba(8,17,26,.02) 70%)}.category-info{position:absolute;z-index:1;bottom:22px;left:22px;right:22px;display:flex;justify-content:space-between;align-items:end}.category-info h3{font-size:20px}.category-info span{font-size:12px;color:#d5dce3}.category-arrow{width:34px;height:34px;border:1px solid rgba(255,255,255,.55);border-radius:50%;display:grid;place-items:center}.category-arrow svg{width:15px}
/* Cards */
.card-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}.vehicle-card{border:1px solid var(--line);border-radius:11px;background:#fff;overflow:hidden;transition:.25s;min-width:0}.vehicle-card:hover{box-shadow:var(--shadow);transform:translateY(-3px)}.vehicle-photo{position:relative;height:195px;background:#e8edf1;overflow:hidden}.vehicle-photo>a,.vehicle-photo img{width:100%;height:100%}.vehicle-photo img{transition:transform .5s}.vehicle-card:hover .vehicle-photo img{transform:scale(1.04)}.vehicle-photo .photo-badge{position:absolute;top:13px;left:13px;background:#fff;color:var(--ink)}.vehicle-photo .save{position:absolute;right:12px;top:12px;width:34px;height:34px}.vehicle-photo .save svg{width:16px}.vehicle-body{padding:19px}.vehicle-top{display:flex;justify-content:space-between;gap:8px;align-items:start}.vehicle-top h3{font-size:16px;line-height:1.35;letter-spacing:-.03em}.vehicle-price{font-family:Manrope;font-size:18px;font-weight:800;letter-spacing:-.05em;white-space:nowrap}.vehicle-trim{font-size:12px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.spec-line{display:flex;align-items:center;gap:8px;margin-top:18px;font-size:12px;color:#6e7986}.spec-line span+span:before{content:"•";margin-right:8px;color:#b5bdc6}.dealer-line{border-top:1px solid var(--line);margin-top:17px;padding-top:14px;display:flex;align-items:center;justify-content:space-between;gap:4px;font-size:11px;color:#6e7986}.dealer-line strong{font-weight:700;color:var(--ink)}.dealer-line .star{color:#e5a12a}.vehicle-link{display:flex;align-items:center;justify-content:space-between;margin-top:16px;color:var(--blue);font-size:12px;font-weight:800}.vehicle-link svg{width:15px}
/* Dealerships and sections */
.dealer-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.dealer-card{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:#fff}.dealer-cover{height:145px;width:100%;background:#dfe5ea}.dealer-content{position:relative;padding:24px}.dealer-avatar{position:absolute;right:22px;top:-30px;width:60px;height:60px;background:var(--navy);color:#fff;border:4px solid #fff;border-radius:10px;display:grid;place-items:center;font:800 19px Manrope}.dealer-content h3{font-size:17px;margin:10px 0 6px}.dealer-meta{font-size:12px;margin-top:15px;display:flex;gap:10px;align-items:center}.dealer-meta svg{width:14px;height:14px}.promo{display:grid;grid-template-columns:1fr 1fr;background:var(--navy);border-radius:14px;overflow:hidden;color:#fff;min-height:400px}.promo-content{padding:65px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center}.promo h2{max-width:470px;margin:16px 0}.promo p{color:#bcc8d7;max-width:420px;line-height:1.8;margin-bottom:25px}.promo-image{background:url('https://images.unsplash.com/photo-1511919884226-fd3cad34687c?auto=format&fit=crop&w=1100&q=85') center/cover}.benefits{display:grid;grid-template-columns:repeat(4,1fr);gap:30px}.benefit-icon{width:50px;height:50px;border-radius:11px;background:#edf1ff;color:var(--blue);display:grid;place-items:center;margin-bottom:22px}.benefit h3{font-size:16px}.benefit p{font-size:13px;line-height:1.7;margin-top:9px}.testimonials{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.quote{border:1px solid var(--line);border-radius:11px;padding:27px;background:#fff}.quote blockquote{margin:17px 0 25px;font-size:15px;color:#344151;line-height:1.7}.quote-person{display:flex;align-items:center;gap:11px}.person-avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#e9edf4;color:var(--navy);font-weight:800;font-size:12px}.quote-person strong{display:block;font-size:12px}.quote-person span{font-size:11px;color:var(--muted)}.final-cta{background:var(--blue);color:#fff;padding:65px 0}.final-row{display:flex;align-items:center;justify-content:space-between;gap:25px}.final-row h2{font-size:clamp(28px,3vw,40px)}.final-row p{color:#dbe3ff;margin-top:10px}.final-actions{display:flex;gap:10px}.final-actions .btn-outline{border-color:rgba(255,255,255,.5);color:white}.final-actions .btn-outline:hover{background:rgba(255,255,255,.1)}
/* Footer */
.footer{background:#101b2b;color:#fff;padding:67px 0 24px}.footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1.4fr;gap:35px}.footer-about p{color:#a8b4c2;max-width:260px;line-height:1.8;margin-top:18px;font-size:13px}.footer h4{font-size:12px;letter-spacing:0;margin-bottom:20px}.footer-links{display:grid;gap:11px;color:#a8b4c2;font-size:12px}.footer-links a:hover{color:#fff}.socials{display:flex;gap:9px;margin-top:20px}.socials a{width:33px;height:33px;border:1px solid #465365;border-radius:50%;display:grid;place-items:center}.socials svg{width:14px;height:14px}.footer-bottom{display:flex;justify-content:space-between;gap:20px;border-top:1px solid #344154;margin-top:55px;padding-top:23px;color:#8997a8;font-size:11px}.footer-bottom div{display:flex;gap:22px}
/* Inner pages */
.page-top{background:#f6f8fa;padding:32px 0}.breadcrumbs{display:flex;gap:8px;align-items:center;color:#89939f;font-size:12px;margin-bottom:20px}.breadcrumbs a:hover{color:var(--blue)}.breadcrumbs svg{width:12px;height:12px}.page-top h1{font-size:clamp(32px,4vw,48px)}.page-top p{margin-top:10px}.inventory-layout{display:grid;grid-template-columns:260px 1fr;gap:30px;padding:38px 0 80px}.filter-panel{border:1px solid var(--line);border-radius:10px;padding:20px;height:max-content;background:#fff}.filter-heading{display:flex;justify-content:space-between;align-items:center}.filter-heading h3{font-size:16px}.clear-button{border:0;background:transparent;color:var(--blue);font-size:12px;font-weight:700;padding:5px}.filter-group{padding:16px 0;border-top:1px solid var(--line);margin-top:16px}.filter-group label{display:block;font-size:12px;font-weight:800;margin-bottom:9px}.filter-group select,.filter-group input,.field input,.field select,.field textarea{width:100%;border:1px solid #dfe5eb;border-radius:7px;background:#fff;color:var(--ink);padding:11px 12px;outline:none;min-height:43px}.filter-group select:focus,.field input:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #e8edff}.filter-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.check-label{display:flex!important;align-items:center;gap:8px;font-weight:500!important;color:#56616f;margin:9px 0!important}.check-label input{width:15px;height:15px;min-height:0;accent-color:var(--blue)}.results-toolbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.results-toolbar h3{font-size:18px}.sort-control{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}.sort-control select{border:1px solid var(--line);border-radius:7px;padding:10px;background:white;color:var(--ink)}.inventory-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}.chip{display:flex;align-items:center;gap:7px;background:#edf2ff;color:#3455cc;border:0;border-radius:20px;padding:7px 10px;font-size:11px;font-weight:700}.chip svg{width:12px;height:12px}.pagination{display:flex;justify-content:center;gap:7px;margin-top:35px}.pagination button{width:39px;height:39px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink)}.pagination button.active{background:var(--navy);color:#fff;border-color:var(--navy)}.empty{padding:80px 20px;text-align:center;background:#f8fafc;border:1px dashed #d6dee8;border-radius:10px}.empty svg{width:35px;height:35px;color:#9aa9ba}.empty h3{margin:15px 0 8px}.empty p{max-width:380px;margin:0 auto 20px}.mobile-filter-bar{display:none}
/* Detail */
.detail-wrap{padding:30px 0 80px}.detail-head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:24px}.detail-head h1{font-size:clamp(30px,3vw,43px)}.detail-head p{margin-top:8px}.detail-price{text-align:right}.detail-price strong{display:block;font:800 30px Manrope;letter-spacing:-.05em}.detail-gallery{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;height:380px;border-radius:12px;overflow:hidden;background:#e7ebef}.detail-gallery button{padding:0;border:0;background:#e7ebef;overflow:hidden}.detail-gallery img{width:100%;height:100%;transition:.3s}.detail-gallery button:hover img{transform:scale(1.04)}.gallery-side{display:grid;grid-template-rows:1fr 1fr;gap:8px;min-width:0}.detail-columns{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:45px;margin-top:35px}.detail-section{padding:0 0 30px;margin-bottom:30px;border-bottom:1px solid var(--line)}.detail-section h2{font-size:23px;margin-bottom:20px}.spec-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.spec-item{background:#f7f9fa;padding:15px;border-radius:8px}.spec-item span{display:block;font-size:11px;color:var(--muted)}.spec-item strong{display:block;margin-top:5px;font-size:13px}.feature-list{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.feature-list span{display:flex;gap:8px;align-items:center;font-size:13px}.feature-list svg{color:var(--green);width:16px}.contact-card{border:1px solid var(--line);border-radius:12px;padding:24px;box-shadow:var(--shadow);position:sticky;top:20px;height:max-content}.contact-card h3{margin-bottom:8px}.contact-card .btn{width:100%;margin-top:10px}.contact-card .field{margin-top:12px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.field textarea{resize:vertical;min-height:80px}.trust-row{display:flex;gap:7px;align-items:center;color:var(--green);font-size:12px;font-weight:700;margin-top:15px}.trust-row svg{width:15px}.finance{display:flex;align-items:center;justify-content:space-between;background:#f1f4ff;padding:17px;border-radius:8px}.finance strong{font-size:18px}.finance span{display:block;font-size:11px;color:var(--muted)}
/* Dealer/category */
.dealer-hero{height:310px;background:linear-gradient(90deg,rgba(12,24,39,.8),rgba(12,24,39,.15)),url('https://images.unsplash.com/photo-1562519819-016930ada31b?auto=format&fit=crop&w=1800&q=85') center/cover}.dealer-profile-head{display:flex;gap:20px;align-items:center;margin-top:-40px;position:relative}.dealer-profile-logo{width:100px;height:100px;background:var(--navy);border:5px solid white;color:#fff;border-radius:14px;display:grid;place-items:center;font:800 30px Manrope}.dealer-profile-info{padding-top:40px;flex:1}.dealer-profile-info h1{font-size:32px}.dealer-profile-info p{margin-top:6px}.dealer-profile-actions{padding-top:40px}.category-hero{position:relative;background:#243345;color:#fff;min-height:310px;display:flex;align-items:center}.category-hero:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(9,20,32,.87),rgba(9,20,32,.15))}.category-hero .wrap{position:relative}.category-hero h1{font-size:clamp(36px,4vw,55px);margin:15px 0}.category-hero p{color:#e4eaf1}.category-hero .eyebrow{color:#b3c4ff}
/* Modal */

<section class="section"><div class="wrap"><div class="section-head"><div><div class="eyebrow">Good people. Great cars.</div><h2>Meet your dealerships.</h2><p>Real people, great reputations, and cars you'll love.</p></div><a href="#dealers" data-go="dealers" class="text-link">All dealerships ${icon('arrow-right')}</a></div><div class="dealer-grid">${dealers.map(dealerCard).join('')}</div></div></section>
<section class="wrap"><div class="promo"><div class="promo-content"><div class="eyebrow" style="color:#aebfff">A better way to sell</div><h2>Ready for your next chapter?</h2><p>Make your current car someone else's next great find. We'll connect you with trusted buyers, minus the guesswork.</p><button class="btn btn-light" data-action="sell">Sell your car ${icon('arrow-right')}</button></div><div class="promo-image" role="img" aria-label="Car on an open road"></div></div></section>
<section class="section"><div class="wrap"><div class="section-head"><div><div class="eyebrow">The VERRA difference</div><h2>Feel good about the journey.</h2><p>Thoughtfully designed around the way you actually shop.</p></div></div><div class="benefits">${[['shield-check','Dealers you can trust','Every dealership is vetted, verified, and ready to help.'],['sliders-horizontal','A search that gets you','Find what matters with simple, powerful search tools.'],['badge-dollar-sign','Clarity at every turn','Straightforward details to help you make your move.'],['heart-handshake','A human connection','Talk directly with real people who know their cars.']].map(x=>`<div class="benefit"><div class="benefit-icon">${icon(x[0])}</div><h3>${x[1]}</h3><p>${x[2]}</p></div>`).join('')}</div></div></section>
<section class="section section-soft"><div class="wrap"><div class="section-head"><div><div class="eyebrow">The word on the road</div><h2>Good cars. Better stories.</h2></div><div class="small"><span class="stars">★★★★★</span> &nbsp; Loved by drivers</div></div><div class="testimonials">${[['“The whole experience felt refreshingly straightforward. I found my car and a dealership I actually trust.”','Sarah M.','Scottsdale, AZ'],['“From browsing to the test drive, everything just made sense. It was the easiest car search I’ve had.”','James R.','Austin, TX'],['“Beautiful selection, helpful people, and no surprises. Exactly how buying a car should feel.”','Alicia T.','Los Angeles, CA']].map((x,i)=>`<article class="quote"><div class="stars">★★★★★</div><blockquote>${x[0]}</blockquote><div class="quote-person"><div class="person-avatar">${['SM','JR','AT'][i]}</div><div><strong>${x[1]}</strong><span>${x[2]}</span></div></div></article>`).join('')}</div></div></section>${finalCTA()}</main>`}
function finalCTA(){return `<section class="final-cta"><div class="wrap final-row"><div><h2>Your next great drive awaits.</h2><p>Let's find the one that feels right.</p></div><div class="final-actions"><a href="#inventory" data-go="inventory" class="btn btn-light">Explore cars ${icon('arrow-right')}</a><a href="#dealers" data-go="dealers" class="btn btn-outline">Meet our dealers</a></div></div></section>`}
function crumbs(items){return `<div class="breadcrumbs"><a href="#home" data-go="home">Home</a>${items.map(x=>`${icon('chevron-right')}<span>${x}</span>`).join('')}</div>`}
function filterPanel(){const f=state.filters;const option=(label,value,selected)=>`<option value="${value}" ${String(selected||'')===String(value)?'selected':''}>${label}</option>`;return `<aside class="filter-panel" id="filter-panel"><div class="filter-heading"><h3>Filters</h3><div><button class="clear-button" data-action="clear">Reset all</button><button class="clear-button filter-close" data-action="filter-close">Done</button></div></div><div class="filter-group"><label for="f-make">Make</label><select id="f-make" data-filter="make">${option('All makes','',f.make)}${[...new Set(cars.map(c=>c.make))].map(m=>option(m,m,f.make)).join('')}</select></div><div class="filter-group"><label for="f-model">Model</label><select id="f-model" data-filter="model">${option('All models','',f.model)}${cars.filter(c=>!f.make||c.make===f.make).map(c=>option(c.model,c.model,f.model)).join('')}</select></div><div class="filter-group"><label for="f-price">Maximum price</label><select id="f-price" data-filter="maxPrice">${option('Any price','',f.maxPrice)}${[30000,40000,60000,80000,100000,150000].map(n=>option(money(n),n,f.maxPrice)).join('')}</select></div><div class="filter-group"><label for="f-year">Minimum year</label><select id="f-year" data-filter="minYear">${option('Any year','',f.minYear)}${[2023,2022,2021,2020,2019].map(n=>option(n,n,f.minYear)).join('')}</select></div><div class="filter-group"><label for="f-mileage">Maximum mileage</label><select id="f-mileage" data-filter="maxMiles">${option('Any mileage','',f.maxMiles)}${[10000,20000,30000,50000].map(n=>option(n.toLocaleString()+' miles',n,f.maxMiles)).join('')}</select></div><div class="filter-group"><label for="f-body">Body style</label><select id="f-body" data-filter="body">${option('All body styles','',f.body)}${['SUV','Sedan','Truck','Coupe'].map(v=>option(v,v,f.body)).join('')}</select></div><div class="filter-group"><label for="f-fuel">Fuel type</label><select id="f-fuel" data-filter="fuel">${option('All fuel types','',f.fuel)}${['Gasoline','Hybrid','Electric'].map(v=>option(v,v,f.fuel)).join('')}</select></div><div class="filter-group"><label for="f-trans">Transmission</label><select id="f-trans" data-filter="transmission">${option('Any transmission','',f.transmission)}${['Automatic','Manual'].map(v=>option(v,v,f.transmission)).join('')}</select></div><div class="filter-group"><label>Features</label>${['Leather seats','Sunroof','Navigation','Backup camera','Heated seats'].map(v=>`<label class="check-label"><input type="checkbox" data-filter="feature" value="${v}" ${f.feature===v?'checked':''}> ${v}</label>`).join('')}</div></aside>`}
function getResults(){let f=state.filters;let list=cars.filter(c=>(!state.favOnly||state.favorites.includes(c.id))&&(!state.category||c.body===state.category)&&(!f.make||c.make===f.make)&&(!f.model||c.model===f.model)&&(!f.maxPrice||c.price<=+f.maxPrice)&&(!f.minYear||c.year>=+f.minYear)&&(!f.maxMiles||c.miles<=+f.maxMiles)&&(!f.body||c.body===f.body)&&(!f.fuel||c.fuel===f.fuel)&&(!f.transmission||c.transmission===f.transmission)&&(!f.feature||c.features.includes(f.feature)));if(state.sort==='price-low')list.sort((a,b)=>a.price-b.price);if(state.sort==='price-high')list.sort((a,b)=>b.price-a.price);if(state.sort==='mileage')list.sort((a,b)=>a.miles-b.miles);if(state.sort==='year')list.sort((a,b)=>b.year-a.year);return list}
function inventory(category=false){let results=getResults();let pageSize=6,totalPages=Math.ceil(results.length/pageSize);if(state.pageNum>Math.max(1,totalPages))state.pageNum=1;let pageCars=results.slice((state.pageNum-1)*pageSize,state.pageNum*pageSize);const names={make:'Make',model:'Model',maxPrice:'Under',minYear:'Year from',maxMiles:'Under',body:'Body',fuel:'Fuel',transmission:'Transmission',feature:'Feature'};let chips=Object.entries(state.filters).filter(([k,v])=>v).map(([k,v])=>`<button class="chip" data-remove-filter="${k}">${names[k]}: ${k==='maxPrice'?money(+v):k==='maxMiles'?Number(v).toLocaleString()+' mi':v} ${icon('x')}</button>`).join('');let title=state.favOnly?'Your saved vehicles':category?`${state.category}s for every journey`:'Find your next vehicle';return `<main>${category?`<section class="category-hero" style="background-image:url('${IMG[state.category.toLowerCase()]||IMG.suv}');background-size:cover;background-position:center"><div class="wrap"><div class="eyebrow">Find your kind of drive</div><h1>${title}.</h1><p>Explore exceptional ${state.category.toLowerCase()}s from dealerships you can trust.</p></div></section>`:`<div class="page-top"><div class="wrap">${crumbs([state.favOnly?'Favorites':'Browse cars'])}<h1>${title}.</h1><p>${state.favOnly?'All the cars you love, in one place.':'Your next great drive starts right here.'}</p></div></div>`}<div class="wrap inventory-layout">${filterPanel()}<div><div class="results-toolbar"><div><h3>${results.length} ${results.length===1?'vehicle':'vehicles'} found</h3><p class="small">From verified dealerships</p></div><label class="sort-control">Sort by <select id="sort" aria-label="Sort vehicles"><option value="recommended" ${state.sort==='recommended'?'selected':''}>Recommended</option><option value="price-low" ${state.sort==='price-low'?'selected':''}>Price: low to high</option><option value="price-high" ${state.sort==='price-high'?'selected':''}>Price: high to low</option><option value="mileage" ${state.sort==='mileage'?'selected':''}>Lowest mileage</option><option value="year" ${state.sort==='year'?'selected':''}>Newest year</option></select></label></div>${chips?`<div class="chips">${chips}</div>`:''}${state.loading?`<div class="card-grid inventory-grid">${Array.from({length:6},()=>`<div class="skeleton-card"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>`).join('')}</div>`:pageCars.length?`<div class="card-grid inventory-grid">${pageCars.map(vehicleCard).join('')}</div>${totalPages>1?`<nav class="pagination" aria-label="Results pages">${Array.from({length:totalPages},(_,i)=>`<button data-page-num="${i+1}" class="${state.pageNum===i+1?'active':''}" aria-label="Page ${i+1}">${i+1}</button>`).join('')}</nav>`:''}`:`<div class="empty">${icon('search-x')}<h3>No vehicles found</h3><p>${state.favOnly?'Save a few favorites as you browse and they’ll appear here.':'Try broadening your filters or exploring another body style.'}</p><button class="btn btn-dark" data-action="${state.favOnly?'browse':'clear'}">${state.favOnly?'Browse cars':'Clear filters'}</button></div>`}<div class="mobile-filter-bar"><button class="btn btn-dark" data-action="filter-open">${icon('sliders-horizontal')} Filter & sort</button></div></div></div></main>`}
function detail(){let c=cars.find(x=>x.id===state.id);if(!c)return `<main class="wrap section"><div class="empty">${icon('car-front')}<h3>This listing is unavailable</h3><p>It may have found a new home. Explore similar vehicles instead.</p><a class="btn" href="#inventory" data-go="inventory">Browse available cars</a></div></main>`;let d=dealers.find(x=>x.name===c.dealer);let images=[c.image,IMG.car5,IMG.car6,IMG.car7,IMG.car3];return `<main class="wrap detail-wrap">${crumbs(['Browse cars',`${c.year} ${c.make} ${c.model}`])}<div class="detail-head"><div><span class="badge badge-green">${icon('check')} Available now</span><h1 style="margin-top:10px">${c.year} ${c.make} ${c.model}</h1><p>${c.trim} · ${c.location}</p></div><div class="detail-price"><strong>${money(c.price)}</strong><span class="small muted">${c.miles.toLocaleString()} miles</span></div></div><div class="detail-gallery"><button data-gallery="0" aria-label="Open main photo"><img src="${images[0]}" alt="${c.make} ${c.model} exterior"></button><div class="gallery-side"><button data-gallery="1" aria-label="Open photo 2"><img src="${images[1]}" alt="Vehicle gallery photo"></button><button data-gallery="2" aria-label="Open photo 3"><img src="${images[2]}" alt="Vehicle gallery photo"></button></div><div class="gallery-side"><button data-gallery="3" aria-label="Open photo 4"><img src="${images[3]}" alt="Vehicle gallery photo"></button><button data-gallery="4" aria-label="Open photo 5"><img src="${images[4]}" alt="Vehicle gallery photo"></button></div></div><div class="detail-columns"><div><section class="detail-section"><h2>At a glance</h2><div class="spec-grid">${[['Mileage',c.miles.toLocaleString()+' mi'],['Body style',c.body],['Transmission',c.transmission],['Fuel type',c.fuel],['Year',c.year],['Availability','Available']].map(x=>`<div class="spec-item"><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join('')}</div></section><section class="detail-section"><h2>Equipment & features</h2><div class="feature-list">${[...new Set([...c.features,'Bluetooth','Cruise control','Keyless entry','Alloy wheels'])].map(x=>`<span>${icon('check-circle-2')} ${x}</span>`).join('')}</div></section><section class="detail-section"><h2>Estimated financing</h2><div class="finance"><div><strong>~${money(Math.round(c.price*.8*.0193))}/mo</strong><span>Estimated payment · 60 months</span></div>${icon('calculator')}</div><p class="small" style="margin-top:10px">Illustrative estimate with 20% down and 7% APR. Taxes, fees, and credit approval not included. Ask the dealer for actual terms.</p></section><section class="detail-section"><h2>Meet the dealership</h2><div style="display:flex;gap:15px;align-items:center"><div class="dealer-profile-logo" style="width:62px;height:62px;font-size:17px;border:0">${d.initials}</div><div><strong>${d.name}</strong> <span class="badge badge-green">${icon('badge-check')} Verified</span><p class="small"><span class="stars">★</span> ${d.rating} (${d.reviews} reviews) · ${d.location}</p><a href="#dealer" data-dealer="${d.name}" class="text-link small" style="color:var(--blue);margin-top:5px">View dealer profile ${icon('arrow-right')}</a></div></div></section></div><aside class="contact-card"><h3>Interested in this vehicle?</h3><p class="small">Connect directly with ${d.name}.</p><form id="inquiry-form"><div class="field"><label for="inquiry-name">Your name</label><input id="inquiry-name" name="name" placeholder="Full name" required></div><div class="field"><label for="inquiry-email">Email address</label><input id="inquiry-email" name="email" type="email" placeholder="you@example.com" required></div><div class="field"><label for="inquiry-message">Message</label><textarea id="inquiry-message" name="message">Hi, I'm interested in the ${c.year} ${c.make} ${c.model}. Is it still available?</textarea></div><button type="submit" class="btn">Contact dealer ${icon('arrow-right')}</button></form><button class="btn btn-outline" data-action="schedule">${icon('calendar-days')} Schedule test drive</button><div class="trust-row">${icon('shield-check')} Verified dealer · Your information is secure</div></aside></div><div class="section-head" style="margin-top:30px"><div><div class="eyebrow">Keep exploring</div><h2>More cars to love.</h2></div><a href="#inventory" data-go="inventory" class="text-link">View all cars ${icon('arrow-right')}</a></div><div class="card-grid">${cars.filter(x=>x.id!==c.id).slice(0,4).map(vehicleCard).join('')}</div></main>`}
function dealerPage(){let d=dealers.find(x=>x.name===state.dealer)||dealers[0];let list=cars.filter(c=>c.dealer===d.name);return `<main><div class="dealer-hero" style="background-image:linear-gradient(90deg,rgba(12,24,39,.8),rgba(12,24,39,.15)),url('${d.img}')"></div><div class="wrap"><div class="dealer-profile-head"><div class="dealer-profile-logo">${d.initials}</div><div class="dealer-profile-info"><span class="badge badge-green">${icon('badge-check')} Verified dealership</span><h1>${d.name}</h1><p><span class="stars">★</span> ${d.rating} (${d.reviews} reviews) · ${d.location}</p></div><div class="dealer-profile-actions"><a href="tel:${d.phone.replace(/[^\d+]/g,'')}" class="btn btn-outline">${icon('phone')} ${d.phone}</a></div></div><div class="divider" style="margin-top:30px"></div><div class="section-head" style="margin-top:35px"><div><div class="eyebrow">Discover your next drive</div><h2>Available inventory.</h2><p>${list.length} vehicles from ${d.name}</p></div></div><div class="card-grid" style="padding-bottom:90px">${list.map(vehicleCard).join('')}</div></div>${finalCTA()}</main>`}
function dealersPage(){return `<main><div class="page-top"><div class="wrap">${crumbs(['Dealerships'])}<h1>Good people. Great cars.</h1><p>Meet the verified dealerships behind every great drive.</p></div></div><section class="section"><div class="wrap"><div class="dealer-grid">${dealers.map(dealerCard).join('')}</div></div></section>${finalCTA()}</main>`}
function aboutPage(){return `<main><div class="page-top"><div class="wrap">${crumbs(['About'])}<h1>Better journeys start here.</h1><p>We're making the road to your next car a little more human.</p></div></div><section class="section"><div class="wrap"><div class="promo"><div class="promo-content"><div class="eyebrow" style="color:#aebfff">Our point of view</div><h2>Finding the right car should feel good.</h2><p>VERRA brings together thoughtful vehicle discovery and trusted local dealerships, so you can spend less time second-guessing and more time looking forward.</p><a class="btn btn-light" href="#inventory" data-go="inventory">Explore cars ${icon('arrow-right')}</a></div><div class="promo-image"></div></div></div></section>${finalCTA()}</main>`}
function designPage(){return `<main><div class="page-top"><div class="wrap">${crumbs(['Design system'])}<h1>The VERRA design system.</h1><p>A practical, reusable foundation for consistent marketplace experiences.</p></div></div><section class="section"><div class="wrap"><div class="section-head"><div><div class="eyebrow">Developer handoff</div><h2>Built to go further.</h2><p>Tokens, components and interaction notes for implementation.</p></div></div><div class="benefits">${[['palette','Color tokens','Midnight #101B2B · Electric blue #315EFB · Warm white #F8F9F8 · Graphite #17212E'],['type','Typography','Manrope for display and headings; DM Sans for body, labels and controls.'],['layout-grid','Responsive grid','1320px max container; 4-column cards on desktop, 2 on mobile. 18–40px gutters.'],['component','Components','Buttons, fields, cards, filters, chips, modals and navigation use shared tokens and states.']].map(x=>`<div class="benefit"><div class="benefit-icon">${icon(x[0])}</div><h3>${x[1]}</h3><p>${x[2]}</p></div>`).join('')}</div><div class="divider" style="margin-top:45px"></div><h3>Implementation notes</h3><p style="max-width:800px;margin-top:12px;line-height:1.8">For a Next.js/TypeScript handoff, map vehicles and dealers to typed data models, extract the shared header, footer, vehicle card, filter panel and modal into components, and persist filters in URL search parameters. This interactive HTML demonstrates the core states and responsive behavior; it is not an editable Figma file or a connected production backend.</p></div></section></main>`}
function render(scroll=false){let content=state.page==='home'?home():state.page==='inventory'?inventory():state.page==='category'?inventory(true):state.page==='detail'?detail():state.page==='dealer'?dealerPage():state.page==='dealers'?dealersPage():state.page==='about'?aboutPage():designPage();document.getElementById('app').innerHTML=header()+content+footer();if(window.lucide)lucide.createIcons();if(scroll)window.scrollTo(0,0)}
function go(page){state.page=page;state.pageNum=1;if(page==='inventory'){state.category='';state.favOnly=false;state.filters={}}render(true);history.replaceState(null,'','#'+page)}
function showModal(title,content,wide=false){document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop" data-action="backdrop"><div class="modal ${wide?'modal-wide':''}" role="dialog" aria-modal="true" aria-label="${title}"><div class="modal-head"><div><h2>${title}</h2></div><button class="modal-close" data-action="close-modal" aria-label="Close">${icon('x')}</button></div>${content}</div></div>`;document.body.classList.add('locked');if(window.lucide)lucide.createIcons();document.querySelector('.modal-close')?.focus()}
function closeModal(){document.getElementById('modal-root').innerHTML='';document.body.classList.remove('locked')}
function toast(text){document.querySelector('.toast')?.remove();let t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=text;document.body.appendChild(t);setTimeout(()=>t.remove(),3500)}
function modalForm(kind){let titles={login:'Welcome back.',signup:'Join the journey.',sell:'Let’s talk about your car.',contact:'How can we help?',schedule:'Schedule a test drive.'};let intro={login:'Log in to keep your favorites close.',signup:'Create an account to save your favorite finds.',sell:'Tell us a little about your vehicle and we’ll be in touch.',contact:'Send us a note and our team will get back to you.',schedule:'Choose a preferred date and the dealer will follow up to confirm.'};showModal(titles[kind],`<p style="margin-bottom:20px">${intro[kind]}</p><form class="modal-form" data-kind="${kind}">${kind!=='login'?`<div class="field"><label for="modal-name">Full name</label><input id="modal-name" required placeholder="Your name"></div>`:''}<div class="field"><label for="modal-email">Email address</label><input id="modal-email" type="email" required placeholder="you@example.com"></div>${['login','signup'].includes(kind)?`<div class="field"><label for="modal-pass">Password</label><input id="modal-pass" type="password" minlength="6" required placeholder="At least 6 characters"></div>`:''}${kind==='sell'?`<div class="field"><label for="modal-car">Vehicle details</label><input id="modal-car" required placeholder="Year, make and model"></div>`:''}${kind==='schedule'?`<div class="field"><label for="modal-date">Preferred date</label><input id="modal-date" type="date" required min="${new Date().toISOString().slice(0,10)}"></div>`:''}${kind==='contact'?`<div class="field"><label for="modal-message">Message</label><textarea id="modal-message" required placeholder="How can we help?"></textarea></div>`:''}<button class="btn" type="submit">${{login:'Log in',signup:'Create account',sell:'Request a conversation',contact:'Send message',schedule:'Request test drive'}[kind]} ${icon('arrow-right')}</button><p class="small" style="margin-top:12px;text-align:center">Demo experience — no information will be sent.</p></form>`)}
function showGallery(index){let c=cars.find(x=>x.id===state.id);if(!c)return;let images=[c.image,IMG.car5,IMG.car6,IMG.car7,IMG.car3];state.galleryIndex=(index+images.length)%images.length;showModal(`Vehicle gallery · ${state.galleryIndex+1} / ${images.length}`,`<img class="modal-image" src="${images[state.galleryIndex]}" alt="Vehicle gallery image ${state.galleryIndex+1}"><div class="gallery-controls"><button class="btn btn-outline btn-sm" data-gallery-nav="-1">${icon('arrow-left')} Previous</button><button class="btn btn-outline btn-sm" data-gallery-nav="1">Next ${icon('arrow-right')}</button></div><p class="small" style="text-align:center;margin-top:12px">Additional images are illustrative.</p>`,true)}
document.addEventListener('click',e=>{let el=e.target.closest('[data-go],[data-action],[data-category],[data-car],[data-save],[data-dealer],[data-gallery],[data-gallery-nav],[data-remove-filter],[data-page-num]');if(!el)return;if(el.tagName==='A')e.preventDefault();
if(el.dataset.go){go(el.dataset.go);return}
if(el.dataset.category){state.page='category';state.category=el.dataset.category;state.filters={};state.favOnly=false;state.pageNum=1;render(true);return}
if(el.dataset.car){state.id=+el.dataset.car;state.page='detail';render(true);return}
if(el.dataset.dealer){state.dealer=el.dataset.dealer;state.page='dealer';render(true);return}
if(el.dataset.save){let id=+el.dataset.save;state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];localStorage.setItem('verra-favorites',JSON.stringify(state.favorites));render();toast(state.favorites.includes(id)?'Added to your favorites':'Removed from favorites');return}
if(el.dataset.gallery!==undefined){showGallery(+el.dataset.gallery);return}
if(el.dataset.galleryNav){showGallery(state.galleryIndex+(+el.dataset.galleryNav));return}
if(el.dataset.removeFilter){delete state.filters[el.dataset.removeFilter];state.pageNum=1;render();return}
if(el.dataset.pageNum){state.pageNum=+el.dataset.pageNum;render(true);return}
let a=el.dataset.action;
if(a==='menu'){let nav=document.querySelector('.mobile-nav');nav.classList.toggle('open');el.setAttribute('aria-expanded',nav.classList.contains('open'))}
if(a==='favorites'){state.page='inventory';state.category='';state.filters={};state.favOnly=true;state.pageNum=1;render(true)}
if(a==='browse')go('inventory');
if(a==='clear'){state.filters={};state.category='';if(state.page==='category')state.page='inventory';state.pageNum=1;render()}
if(a==='filter-open')document.getElementById('filter-panel')?.classList.add('open');
if(a==='filter-close')document.getElementById('filter-panel')?.classList.remove('open');
if(['login','signup','sell','contact','schedule'].includes(a))modalForm(a);
if(a==='close-modal'||(a==='backdrop'&&e.target===el))closeModal();
if(a==='faq')showModal('Frequently asked questions',`<h3>How do I contact a dealer?</h3><p style="margin:8px 0 20px">Open a vehicle listing and use the contact form or call the dealership directly.</p><h3>Are dealerships verified?</h3><p style="margin:8px 0 20px">Our sample marketplace highlights verified dealer profiles and ratings.</p><h3>Can I save vehicles?</h3><p style="margin-top:8px">Select the heart on any vehicle to save it on this device.</p>`);
if(a==='privacy'||a==='terms')showModal(a==='privacy'?'Privacy policy':'Terms of use',`<p>This is a demonstration marketplace. Forms do not transmit personal information, and favorites are stored locally on your device. Inventory, prices, reviews and dealership details are illustrative.</p>`);
});
document.addEventListener('change',e=>{if(e.target.matches('[data-filter]')){let key=e.target.dataset.filter;state.filters[key]=e.target.type==='checkbox'?(e.target.checked?e.target.value:''):e.target.value;if(key==='make')delete state.filters.model;state.pageNum=1;let wasOpen=document.getElementById('filter-panel')?.classList.contains('open');render();if(wasOpen)document.getElementById('filter-panel')?.classList.add('open')}if(e.target.id==='sort'){state.sort=e.target.value;render()}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='hero-search'){let data=new FormData(e.target);state.filters=Object.fromEntries([...data.entries()].filter(([k,v])=>v));state.page='inventory';state.category='';state.favOnly=false;state.pageNum=1;state.loading=true;render(true);setTimeout(()=>{state.loading=false;if(state.page==='inventory')render()},500)}else if(e.target.id==='inquiry-form'){e.target.reset();toast('Demo request received. No message was sent.')}else if(e.target.classList.contains('modal-form')){closeModal();toast('Thanks! This is a demo, so no information was sent.')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();document.getElementById('filter-panel')?.classList.remove('open')}});
render();
</script>
</body>
</html>
